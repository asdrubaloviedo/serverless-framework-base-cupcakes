service: hello-world

custom:
  # Stage activo (por defecto "local")
  stage: ${opt:stage, 'local'}

  # Carga .env según el stage (.env.local / .env.dev)
  dotenv:
    path: .env.${self:custom.stage}

  # Variables de app
  endpointRoot: ${env:ENDPOINT_ROOT, 'cupcakeslife'}
  categoryModule: ${env:CATEGORY_MODULE, 'categorias'}

  # Credenciales DB por env
  db:
    username: ${env:DB_USER, 'postgres'}
    password: ${env:DB_PASSWORD, 'postgres'}
    dbName: ${env:DB_NAME, 'cupcakes'}

  # Domain manager deshabilitado por defecto (evita warnings)
  customDomain:
    enabled: false
    domainName: thecupcakelife.com
    basePath: ''
    stage: prod
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-2
  stage: ${self:custom.stage}

  environment:
    # App
    ENDPOINT_ROOT: ${self:custom.endpointRoot}
    CATEGORY_MODULE: ${self:custom.categoryModule}

    # DB (usamos SIEMPRE .env para no romper offline)
    DB_HOST: ${env:DB_HOST, '127.0.0.1'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_USER: ${env:DB_USER, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'postgres'}
    DB_NAME: ${env:DB_NAME, 'cupcakes'}

functions:
  hello-world:
    handler: ./src/category/handlers/getUser.hello
    events:
      - http:
          path: hello
          method: GET

  getCategoriesNameImageCount:
    handler: ./src/category/handlers/getCategoriesNameImageCount.handler
    events:
      - http:
          path: ${self:custom.endpointRoot}/${self:custom.categoryModule}/categorias-imagen-cantidad
          method: get
          cors: true
      - http:
          path: ${self:custom.endpointRoot}/${self:custom.categoryModule}/categorias-imagen-cantidad/usuario
          method: get
          cors: true

plugins:
  - serverless-offline
  - serverless-domain-manager
  - serverless-dotenv-plugin

resources:
  Conditions:
    IsDev:
      Fn::Equals:
        - ${self:custom.stage}
        - dev

  Resources:
    # RDS SOLO en dev
    MyPostgresDB:
      Type: AWS::RDS::DBInstance
      Condition: IsDev
      Properties:
        DBInstanceClass: db.t3.micro
        Engine: postgres
        EngineVersion: "17.6"
        DBInstanceIdentifier: ${self:service}-${self:custom.stage}-db
        MasterUsername: ${self:custom.db.username}
        MasterUserPassword: ${self:custom.db.password}
        DBName: ${self:custom.db.dbName}
        AllocatedStorage: 20
        StorageType: gp2
        PubliclyAccessible: true
        VPCSecurityGroups:
          - Ref: MySecurityGroup
        MultiAZ: false
        DeletionProtection: false
        BackupRetentionPeriod: 1
        AutoMinorVersionUpgrade: true

    MySecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Condition: IsDev
      Properties:
        GroupDescription: "Allow access to Postgres DB (dev)"
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            # ⚠️ Reemplaza por tu IP pública en /32 para dev
            CidrIp: "38.43.130.101/32"

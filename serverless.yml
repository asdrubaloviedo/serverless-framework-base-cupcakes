service: hello-world
frameworkVersion: "3"
useDotenv: true

params:
  dev:
    VpcId: vpc-02b24c56982844a6f
    SubnetIdA: subnet-0e533b15b927c27d5
    SubnetIdB: subnet-09747a532ca000dc2

custom:
  stage: ${opt:stage, 'local'}

  runtimeByStage:
    local: nodejs20.x
    dev: nodejs22.x
    prod: nodejs22.x

  endpointRoot: ${env:ENDPOINT_ROOT, 'cupcakeslife'}
  categoryModule: ${env:CATEGORY_MODULE, 'categorias'}
  cupcakeModule: ${env:CUPCAKE_MODULE, 'cupcakes'}
  festivityModule: ${env:FESTIVITY_MODULE, 'festividades'}
  ingredientModule: ${env:INGREDIENT_MODULE, 'ingredientes'}
  packageModule: ${env:PACKAGE_MODULE, 'paquetes'}
  recipeModule: ${env:RECIPE_MODULE, 'recipes'}
  userModule: ${env:USER_MODULE, 'usuarios'}

  db:
    local:
      host: 127.0.0.1
      port: '5432'
      user: postgres
      password: postgres
      name: cupcakes
      sslmode: disable

  ssmPrefixByStage:
    dev: /cupcakes/dev
    prod: /cupcakes/prod

  vpcByStage:
    local: {}
    dev:
      securityGroupIds:
        - Ref: MyLambdaSecurityGroup
      subnetIds:
        - ${param:SubnetIdA, 'subnet-00000000000000000'}
        - ${param:SubnetIdB, 'subnet-00000000000000000'}
    prod: {}

  basePathByStage:
    local: local
    dev: dev
    prod: ""

  createRecord:
    local: false
    dev: true
    prod: true

  customDomain:
    domainName: api.thecupcakelife.com
    basePath: ${self:custom.basePathByStage.${self:custom.stage}}
    stage: ${self:custom.stage}
    endpointType: edge
    apiType: rest
    createRoute53Record: ${self:custom.createRecord.${self:custom.stage}}
    securityPolicy: tls_1_2
    certificateArn: arn:aws:acm:us-east-1:823999505065:certificate/67ca50d3-f7a6-4c45-943d-b58276c70451

  corsCommon:
    origins:
      - https://www.thecupcakelife.com
      - https://thecupcakelife.com
    headers:
      - Content-Type
      - Authorization
    allowCredentials: false
    cacheControl: 'max-age=600'

provider:
  name: aws
  runtime: ${self:custom.runtimeByStage.${self:custom.stage}}
  region: us-east-2
  stage: ${self:custom.stage}
  vpc: ${self:custom.vpcByStage.${self:custom.stage}}

  # =========================================================
  # IAM
  # =========================================================
  #
  # Permite que las funciones Lambda envíen correos mediante
  # Amazon SES.
  #
  # Por ahora solo concedemos la acción que realmente necesita
  # el flujo de recuperación de contraseña.
  #
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: "*"

  environment:
    ENDPOINT_ROOT: ${self:custom.endpointRoot}
    CATEGORY_MODULE: ${self:custom.categoryModule}
    CUPCAKE_MODULE: ${self:custom.cupcakeModule}
    FESTIVITY_MODULE: ${self:custom.festivityModule}
    INGREDIENT_MODULE: ${self:custom.ingredientModule}
    PACKAGE_MODULE: ${self:custom.packageModule}
    RECIPE_MODULE: ${self:custom.recipeModule}
    USER_MODULE: ${self:custom.userModule}

    DB_HOST: ${self:custom.db.${self:custom.stage}.host, ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/DB_HOST}
    DB_PORT: ${self:custom.db.${self:custom.stage}.port, ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/DB_PORT}
    DB_USER: ${self:custom.db.${self:custom.stage}.user, ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/DB_USER}
    DB_PASSWORD: ${self:custom.db.${self:custom.stage}.password, ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/DB_PASSWORD}
    DB_NAME: ${self:custom.db.${self:custom.stage}.name, ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/DB_NAME}
    PGSSLMODE: ${self:custom.db.${self:custom.stage}.sslmode, ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/PGSSLMODE}

    # Correo remitente utilizado para emails personalizados.
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL}

    FIREBASE_PROJECT_ID: ${ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/FIREBASE_PROJECT_ID}
    FIREBASE_CLIENT_EMAIL: ${ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/FIREBASE_CLIENT_EMAIL}
    FIREBASE_PRIVATE_KEY: ${ssm:${self:custom.ssmPrefixByStage.${self:custom.stage}}/FIREBASE_PRIVATE_KEY}

  versionFunctions: true

functions: ${file(./functions.yml)}

plugins:
  - serverless-offline
  - serverless-domain-manager

resources:
  Conditions:
    IsDev:
      Fn::Equals:
        - ${self:custom.stage}
        - dev

  Resources:
    MyDbSubnetGroup:
      Type: AWS::RDS::DBSubnetGroup
      Condition: IsDev
      Properties:
        DBSubnetGroupDescription: "Subnet group RDS (dev)"
        SubnetIds:
          - ${param:SubnetIdA, 'subnet-00000000000000000'}
          - ${param:SubnetIdB, 'subnet-00000000000000000'}

    MyLambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Condition: IsDev
      Properties:
        GroupDescription: "Lambda SG (dev)"
        VpcId: ${param:VpcId, 'vpc-00000000000000000'}

    MySecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Condition: IsDev
      Properties:
        GroupDescription: "Allow access to Postgres DB (dev)"
        VpcId: ${param:VpcId, 'vpc-00000000000000000'}
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: "38.43.130.101/32"
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId:
              Ref: MyLambdaSecurityGroup

    MyPostgresDB:
      Type: AWS::RDS::DBInstance
      Condition: IsDev
      Properties:
        DBInstanceClass: db.t3.micro
        Engine: postgres
        EngineVersion: "17.6"
        DBInstanceIdentifier: ${self:service}-${self:custom.stage}-db
        MasterUsername: ${self:provider.environment.DB_USER}
        MasterUserPassword: ${self:provider.environment.DB_PASSWORD}
        DBName: ${self:provider.environment.DB_NAME}
        AllocatedStorage: 20
        StorageType: gp2
        PubliclyAccessible: true
        MultiAZ: false
        AutoMinorVersionUpgrade: true
        BackupRetentionPeriod: 1
        DBSubnetGroupName:
          Ref: MyDbSubnetGroup
        VPCSecurityGroups:
          - Ref: MySecurityGroup

  Outputs:
    RdsEndpoint:
      Condition: IsDev
      Description: "RDS endpoint (host)"
      Value:
        Fn::GetAtt: [MyPostgresDB, Endpoint.Address]
service: hello-world

params:
  dev:
    VpcId: vpc-02b24c56982844a6f
    SubnetIdA: subnet-0e533b15b927c27d5
    SubnetIdB: subnet-09747a532ca000dc2

custom:
  # Stage activo (por defecto "local")
  stage: ${opt:stage, 'local'}

  # Cargar .env según el stage (.env.local / .env.dev)
  dotenv:
    path: .env.${self:custom.stage}

  # Variables de app
  endpointRoot: ${env:ENDPOINT_ROOT, 'cupcakeslife'}
  categoryModule: ${env:CATEGORY_MODULE, 'categorias'}

  # Credenciales DB unificadas
  db:
    username: ${env:DB_USER, 'postgres'}
    password: ${env:DB_PASSWORD, 'postgres'}
    dbName:    ${env:DB_NAME, 'cupcakes'}

  # Domain manager deshabilitado por defecto
  customDomain:
    enabled: false
    domainName: thecupcakelife.com
    basePath: ''
    stage: prod
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-2
  stage: ${self:custom.stage}

  # En DEV, las Lambdas se ejecutarán dentro de la VPC indicada.
  # Para que "local" no se rompa, dejamos defaults inofensivos.
  vpc:
    securityGroupIds:
      - Ref: MyLambdaSecurityGroup
    subnetIds:
      - ${param:SubnetIdA, 'subnet-00000000000000000'}
      - ${param:SubnetIdB, 'subnet-00000000000000000'}

  environment:
    # App
    ENDPOINT_ROOT: ${self:custom.endpointRoot}
    CATEGORY_MODULE: ${self:custom.categoryModule}

    # DB (usamos .env para ambos stages)
    DB_HOST: ${env:DB_HOST, '127.0.0.1'}
    DB_PORT: ${env:DB_PORT, '5432'}
    DB_USER: ${env:DB_USER, 'postgres'}
    DB_PASSWORD: ${env:DB_PASSWORD, 'postgres'}
    DB_NAME: ${env:DB_NAME, 'cupcakes'}
    PGSSLMODE: require

functions:
  hello-world:
    handler: ./src/category/handlers/getUser.hello
    events:
      - http:
          path: hello
          method: GET

  getCategoriesNameImageCount:
    handler: ./src/category/handlers/getCategoriesNameImageCount.handler
    events:
      - http:
          path: ${self:custom.endpointRoot}/${self:custom.categoryModule}/categorias-imagen-cantidad
          method: get
          cors: true
      - http:
          path: ${self:custom.endpointRoot}/${self:custom.categoryModule}/categorias-imagen-cantidad/usuario
          method: get
          cors: true

plugins:
  - serverless-offline
  - serverless-domain-manager
  - serverless-dotenv-plugin

resources:
  Conditions:
    IsDev:
      Fn::Equals:
        - ${self:custom.stage}
        - dev

  Resources:
    # Subnet Group para RDS (usa 2 subnets en AZ distintas)
    MyDbSubnetGroup:
      Type: AWS::RDS::DBSubnetGroup
      Condition: IsDev
      Properties:
        DBSubnetGroupDescription: "Subnet group RDS (dev)"
        SubnetIds:
          - ${param:SubnetIdA}
          - ${param:SubnetIdB}

    # SG para las Lambdas dentro de la VPC
    MyLambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Condition: IsDev
      Properties:
        GroupDescription: "Lambda SG (dev)"
        VpcId: ${param:VpcId}

    # SG de la RDS: permite desde tu IP y desde el SG de Lambda
    MySecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Condition: IsDev
      Properties:
        GroupDescription: "Allow access to Postgres DB (dev)"
        VpcId: ${param:VpcId}
        SecurityGroupIngress:
          # Acceso directo desde tu IP pública (para pruebas desde tu PC)
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            # ⚠️ Reemplaza por tu IP pública /32
            CidrIp: "38.43.130.101/32"
          # Acceso desde las Lambdas en la VPC (SG -> SG)
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId:
              Ref: MyLambdaSecurityGroup

    # Instancia RDS PostgreSQL
    MyPostgresDB:
      Type: AWS::RDS::DBInstance
      Condition: IsDev
      Properties:
        DBInstanceClass: db.t3.micro
        Engine: postgres
        EngineVersion: "17.6"
        DBInstanceIdentifier: ${self:service}-${self:custom.stage}-db
        MasterUsername: ${self:custom.db.username}
        MasterUserPassword: ${self:custom.db.password}
        DBName: ${self:custom.db.dbName}
        AllocatedStorage: 20
        StorageType: gp2
        PubliclyAccessible: true
        MultiAZ: false
        AutoMinorVersionUpgrade: true
        BackupRetentionPeriod: 1
        DBSubnetGroupName:
          Ref: MyDbSubnetGroup
        VPCSecurityGroups:
          - Ref: MySecurityGroup

  Outputs:
    RdsEndpoint:
      Condition: IsDev
      Description: "RDS endpoint (host)"
      Value:
        Fn::GetAtt: [ MyPostgresDB, Endpoint.Address ]

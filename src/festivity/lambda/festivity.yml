festivity:
  handler: ./src/festivity/handlers/festivity.handler
  events:
    - http:
        path: ${self:custom.endpointRoot}/${self:custom.festivityModule}/festividades-imagen-cantidad
        method: get
        cors: ${self:custom.corsCommon}
    - http:
        path: ${self:custom.endpointRoot}/${self:custom.festivityModule}/festividades-imagen-cantidad/usuario
        method: get
        cors: ${self:custom.corsCommon}
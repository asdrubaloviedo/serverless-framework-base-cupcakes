
legal-auth:
  handler: ./src/user/handlers/legal-auth.handler

  # Desactiva la VPC heredada del provider.
  vpc: ~

  timeout: 25
  memorySize: 512

  # Rol exclusivo para esta Lambda.
  role:
    Fn::GetAtt:
      - LegalAuthLambdaRole
      - Arn

  environment:
    APP_STAGE: ${self:custom.stage}
    LEGAL_AUTH_DB_FUNCTION: ${self:service}-${self:custom.stage}-legal-auth-db

    DB_HOST: ${self:custom.googleAuthDbEnv.${self:custom.stage}.host}
    DB_PORT: ${self:custom.googleAuthDbEnv.${self:custom.stage}.port}
    DB_USER: ${self:custom.googleAuthDbEnv.${self:custom.stage}.user}
    DB_PASSWORD: ${self:custom.googleAuthDbEnv.${self:custom.stage}.password}
    DB_NAME: ${self:custom.googleAuthDbEnv.${self:custom.stage}.name}
    PGSSLMODE: ${self:custom.googleAuthDbEnv.${self:custom.stage}.sslmode}

  events:

    # =========================================================
    # TRADITIONAL USER REGISTRATION
    # =========================================================

    - http:
        path: ${self:custom.endpointRoot}/${self:custom.userModule}/insertar-usuario-nuevo
        method: post
        cors: ${self:custom.corsCommon}


    # =========================================================
    # AUTHENTICATED USER PROFILE
    # =========================================================

    - http:
        path: ${self:custom.endpointRoot}/${self:custom.userModule}/consultar-usuario
        method: get
        cors: ${self:custom.corsCommon}


    # =========================================================
    # LEGAL ACCEPTANCES
    # =========================================================

    - http:
        path: ${self:custom.endpointRoot}/${self:custom.userModule}/consultar-aceptaciones-legales
        method: post
        cors: ${self:custom.corsCommon}

    - http:
        path: ${self:custom.endpointRoot}/${self:custom.userModule}/registrar-aceptaciones-legales
        method: post
        cors: ${self:custom.corsCommon}

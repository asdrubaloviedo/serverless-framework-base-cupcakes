password-reset:
  handler: ./src/user/handlers/password-reset.handler

  # Esta función debe quedar fuera de la VPC global.
  #
  # Necesita salida pública para comunicarse con:
  # - Firebase Authentication
  # - Amazon SES
  #
  # "~" significa null en YAML y hace que Serverless
  # desactive la VPC heredada desde provider.vpc.
  vpc: ~

  timeout: 15
  memorySize: 512

  events:

    # =========================================================
    # PASSWORD RESET
    # =========================================================
    #
    # Endpoint independiente para recuperación de contraseña.
    #
    # Firebase Admin:
    #   -> genera el enlace seguro
    #
    # Amazon SES:
    #   -> envía el correo personalizado
    #
    - http:
        path: ${self:custom.endpointRoot}/${self:custom.userModule}/recuperar-contrasena
        method: post
        cors: ${self:custom.corsCommon}
# .github/workflows/ci.yml
name: CI – Serverless (Node + Jest)

on:
  push:
    branches: [development, 'feature/**']
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 📦 Install deps
        run: |
          echo "::group::npm install"
          npm ci || npm install
          echo "::endgroup::"

      - name: 🧪 Run tests (Jest)
        env:
          CI: "true"
        run: |
          echo "::group::jest"
          npm test --silent -- --coverage
          echo "::endgroup::"

      - name: 📈 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧰 Install Serverless CLI v3 (no login)
        run: npm i -g serverless@3

      - name: 🧱 Serverless package (dev)
        run: |
          echo "::group::serverless package"
          serverless package --stage dev
          echo "::endgroup::"

      # Deploy sólo si haces push a development
      # - name: 🔐 Configure AWS credentials
      #   if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-2

      - name: 🚀 Deploy (dev)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
        run: |
          echo "::group::serverless deploy (dev)"
          serverless deploy --stage dev
          echo "::endgroup::"

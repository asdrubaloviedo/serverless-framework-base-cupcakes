name: CI – Serverless (Node + Jest)

on:
  push:
    branches: [development, 'feature/**']
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 📦 Install deps
        run: |
          echo "::group::npm install"
          npm ci || npm install
          echo "::endgroup::"

      - name: ✅ Validate Node for dev/CI
        run: npm run check:node:dev

      - name: 🧪 Run tests (Jest)
        env:
          CI: "true"
        run: |
          echo "::group::jest"
          npm test --silent -- --coverage
          echo "::endgroup::"

      - name: 🧰 Verify Serverless
        run: npx serverless --version

      - name: 🧱 Serverless print (ci/local config)
        run: |
          echo "::group::serverless print ci"
          npm run print:ci
          echo "::endgroup::"

      - name: 🧱 Serverless package (local)
        run: |
          echo "::group::serverless package local"
          npx serverless package --stage local
          echo "::endgroup::"
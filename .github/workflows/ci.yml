name: CI – Node + Jest

on:
  push:
    branches: [development, 'feature/**']
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_COLOR: 1
      NODE_ENV: test
      NPM_CONFIG_LOGLEVEL: error
    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ⬇️ Install dependencies
        run: |
          echo "::group::Install"
          npm ci --silent --no-progress
          echo "::endgroup::"

      - name: 🧪 Run tests (Jest)
        run: |
          echo "::group::Jest Output"
          npm test --silent -- --color --verbose
          echo "::endgroup::"

      - name: 📊 Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total; console.log('::notice title=Coverage::Statements '+s.statements.pct+'% • Branches '+s.branches.pct+'% • Functions '+s.functions.pct+'% • Lines '+s.lines.pct+'%');"
          fi

      - name: ⬆️ Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

name: CI – Serverless (Node + Jest)

on:
  push:
    branches: [development, 'feature/**']
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 📦 Install deps
        run: |
          echo "::group::npm install"
          npm ci || npm install
          echo "::endgroup::"

      - name: ✅ Validate Node for dev/CI
        run: |
          npm run check:node:dev

      - name: 🧪 Run tests (Jest)
        env:
          CI: "true"
        run: |
          echo "::group::jest"
          npm test --silent -- --coverage
          echo "::endgroup::"

      - name: 📈 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧰 Install Serverless CLI v3
        run: npm i -g serverless@3

      - name: 🧱 Serverless print (dev)
        run: |
          echo "::group::serverless print dev"
          npm run print:dev
          echo "::endgroup::"

      - name: 🧱 Serverless package (local)
        run: |
          echo "::group::serverless package local"
          serverless package --stage local
          echo "::endgroup::"

